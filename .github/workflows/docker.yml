name: Build and Publish Docker Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t gridwise-test .

      - name: Test /health inside container
        run: |
          docker run -d --name gridwise-test-container -p 8000:8000 gridwise-test
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs gridwise-test-container
          exit 1

      - name: Prepare image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gridwise:latest" >> "$GITHUB_ENV"

      - name: Tag image
        run: docker tag gridwise-test "$IMAGE"

      - name: Push image
        run: docker push "$IMAGE"
